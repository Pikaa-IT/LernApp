# ============================================================
# Konfiguration für das 'test'-Profil.
#
# Aktiviert sich, wenn die Anwendung mit:
#   --spring.profiles.active=test
# gestartet wird, oder wenn ein Test mit @ActiveProfiles("test")
# annotiert ist.
#
# Ziel: völlig isolierte Tests, ohne Abhängigkeit von einer
# laufenden MariaDB.
# ============================================================

# H2 als In-Memory-Datenbank, jede Testklasse bekommt einen frischen Zustand.
# DB_CLOSE_DELAY=-1 hält die DB bis zum Ende der JVM offen, sonst
# verliert sie zwischen Test-Methoden ihren Inhalt zu früh.
spring.datasource.url=jdbc:h2:mem:taskdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bei Tests immer frisch beginnen.
spring.jpa.hibernate.ddl-auto=create-drop

# SQL-Ausgabe ausschalten - Test-Logs sollen knapp bleiben.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2-Konsole im Test-Profil nicht nötig.
spring.h2.console.enabled=false
